<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الخدمات والأسعار - Atenza App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="public/js/app-config.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-gray: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --glass: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Premium Header */
        .header-glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .header-text h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--text-dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            color: var(--text-gray);
            font-size: 14px;
            font-weight: 500;
        }

        /* Main Card */
        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 16px;
            padding-right: 45px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            font-size: 15px;
        }

        .search-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        .filter-select {
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            min-width: 180px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-select:focus {
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--text-dark);
            border: 1.5px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: var(--text-gray);
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: #fef3c7;
            color: var(--warning);
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            padding: 16px;
            text-align: right;
            color: var(--text-gray);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 20px 16px;
            background: white;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr td:first-child {
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        tr td:last-child {
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
        }

        tr:hover td {
            background: #fcfdfe;
            border-color: var(--primary);
        }

        .category-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            background: #eef2ff;
            color: var(--primary);
        }

        .price-text {
            font-weight: 800;
            color: var(--success);
            font-size: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 32px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95);
            animation: modalScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalScale { to { transform: scale(1); } }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-dark);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            .header-glass {
                flex-direction: column;
                gap: 20px;
                text-align: center;
                padding: 20px;
            }
            .header-title-group {
                flex-direction: column;
                gap: 15px;
            }
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper {
                max-width: none;
            }
        }
    </style>
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
    <script src="toast_helpers.js"></script>
</head>

<body>
    <div id="atenzaNavbar"></div>
    <div class="container">
        <!-- Header -->
        <div class="header-glass">
            <div class="header-title-group">
                <div class="header-icon">🛠️</div>
                <div class="header-text">
                    <h1>إدارة الخدمات والأسعار</h1>
                    <p>تخصيص وتحديث قائمة الخدمات والأسعار</p>
                </div>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" onclick="APP_NAV.goBack('admin.html')">🔙 رجوع</button>
                <button class="btn btn-primary" onclick="showAddModal()">إضافة خدمة جديدة ➕</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="card">
            <div class="controls-row">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchService" placeholder="بحث عن خدمة..." oninput="renderServices()">
                </div>
                <div>
                    <select id="filterCategory" class="filter-select" onchange="renderServices()">
                        <option value="">جميع الفئات</option>
                    </select>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الفئة</th>
                            <th>اسم الخدمة</th>
                            <th>السعر</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="servicesTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="serviceModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="font-weight: 800; margin-bottom: 25px; color: var(--text-dark);">إضافة خدمة جديدة</h2>
            <form id="serviceForm">
                <input type="hidden" id="serviceId">
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="modalCategory" required onchange="toggleNewCategoryInput()">
                        <option value="new">+ إضافة فئة جديدة</option>
                    </select>
                </div>
                <div id="newCategoryWrapper" class="form-group" style="display: none;">
                    <label>اسم الفئة الجديدة</label>
                    <input type="text" id="newCategoryName" placeholder="مثال: نظام المكابح">
                </div>
                <div class="form-group">
                    <label>اسم الخدمة</label>
                    <input type="text" id="modalServiceName" required placeholder="مثال: فحص وتغيير زيت البريك">
                </div>
                <div class="form-group">
                    <label>السعر (ريال)</label>
                    <input type="number" id="modalPrice" required placeholder="0.00">
                </div>
                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">حفظ</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1; justify-content: center;">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allServices = [];
        let categories = [];

        async function fetchServices() {
            try {
                const response = await fetch('/api/services');
                allServices = await response.json();
                
                // Extract unique categories
                categories = [...new Set(allServices.map(s => s.category))].sort();
                
                updateCategoryDropdowns();
                renderServices();
            } catch (error) {
                console.error('Error fetching services:', error);
                showToast('خطأ في جلب البيانات', 'error');
            }
        }

        function updateCategoryDropdowns() {
            const filterSelect = document.getElementById('filterCategory');
            const modalSelect = document.getElementById('modalCategory');
            
            const optionsHtml = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            
            filterSelect.innerHTML = '<option value="">جميع الفئات</option>' + optionsHtml;
            modalSelect.innerHTML = optionsHtml + '<option value="new">+ إضافة فئة جديدة</option>';
        }

        function renderServices() {
            const searchTerm = document.getElementById('searchService').value.toLowerCase();
            const filterCat = document.getElementById('filterCategory').value;
            const tbody = document.getElementById('servicesTableBody');
            
            const filtered = allServices.filter(s => {
                const matchesSearch = s.service_name.toLowerCase().includes(searchTerm) || 
                                     s.category.toLowerCase().includes(searchTerm);
                const matchesCat = filterCat === "" || s.category === filterCat;
                return matchesSearch && matchesCat;
            });

            tbody.innerHTML = filtered.map(s => `
                <tr>
                    <td><span class="category-badge">${s.category}</span></td>
                    <td style="font-weight: 600;">${s.service_name}</td>
                    <td><span class="price-text">${s.price.toLocaleString()} ﷼</span></td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn btn-warning" style="padding: 6px 12px;" onclick="editService(${s.id})">✏️</button>
                            <button class="btn btn-danger" style="padding: 6px 12px;" onclick="deleteService(${s.id})">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function showAddModal() {
            document.getElementById('modalTitle').innerText = 'إضافة خدمة جديدة';
            document.getElementById('serviceId').value = '';
            document.getElementById('serviceForm').reset();
            document.getElementById('newCategoryWrapper').style.display = 'none';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function toggleNewCategoryInput() {
            const select = document.getElementById('modalCategory');
            const wrapper = document.getElementById('newCategoryWrapper');
            wrapper.style.display = (select.value === 'new') ? 'block' : 'none';
            if(select.value === 'new') document.getElementById('newCategoryName').focus();
        }

        function editService(id) {
            const service = allServices.find(s => s.id === id);
            if (!service) return;

            document.getElementById('modalTitle').innerText = 'تعديل الخدمة';
            document.getElementById('serviceId').value = service.id;
            document.getElementById('modalCategory').value = service.category;
            document.getElementById('modalServiceName').value = service.service_name;
            document.getElementById('modalPrice').value = service.price;
            document.getElementById('newCategoryWrapper').style.display = 'none';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('serviceModal').style.display = 'none';
        }

        document.getElementById('serviceForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('serviceId').value;
            let category = document.getElementById('modalCategory').value;
            if (category === 'new') {
                category = document.getElementById('newCategoryName').value.trim();
                if (!category) {
                    showToast('يرجى إدخال اسم الفئة الجديدة', 'warning');
                    return;
                }
            }
            
            const service_name = document.getElementById('modalServiceName').value.trim();
            const price = parseFloat(document.getElementById('modalPrice').value);

            const data = { category, service_name, price };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/services/${id}` : '/api/services';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    showToast(id ? 'تم التحديث بنجاح' : 'تمت الإضافة بنجاح', 'success');
                    closeModal();
                    fetchServices();
                } else {
                    const err = await res.json();
                    showToast(err.message || 'فشل الحفظ', 'error');
                }
            } catch (error) {
                showToast('خطأ في الاتصال بالخادم', 'error');
            }
        };

        async function deleteService(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الخدمة؟')) return;

            try {
                const res = await fetch(`/api/services/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('تم الحذف بنجاح', 'success');
                    fetchServices();
                } else {
                    showToast('فشل حذف الخدمة', 'error');
                }
            } catch (error) {
                showToast('خطأ في الاتصال بالخادم', 'error');
            }
        }

        // Initial Load
        fetchServices();
        
        // Close modal when clicking outside
        window.onclick = (e) => {
            if (e.target.className === 'modal') closeModal();
        };
    </script>
</body>

</html>
