<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام - الورشة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .section-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .tags-input {
            width: 100%;
            padding: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            background: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tag span {
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ إعدادات النظام</h1>
            <button class="btn btn-secondary" onclick="window.history.back()">🔙 رجوع</button>
        </div>

        <div class="section-box">
            <div class="section-title">🏢 بيانات الورشة (للطباعة)</div>
            <div class="form-group">
                <label>اسم الورشة</label>
                <input type="text" id="workshopName" placeholder="مركز الورشة المتخصص">
            </div>
            <div class="form-group">
                <label>وصف النشاط</label>
                <input type="text" id="workshopDesc" placeholder="صيانة سيارات - سمكرة - دهان">
            </div>
            <div class="form-group">
                <label>رقم الجوال</label>
                <input type="text" id="workshopPhone" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label>الرقم الضريبي</label>
                <input type="text" id="vatNumber" placeholder="30xxxxxxxxxxxxx">
            </div>
            <!-- Future: Logo Upload -->
        </div>

        <!-- Work Schedule Settings -->
        <div class="section-box">
            <div class="section-title">⏱️ مواعيد الدوام الإسبوعية</div>
            <p style="font-size:12px; color:#666; margin-bottom:15px;">حدد أوقات العمل اليومية أو اختر "مغلق" للإجازة.</p>
            <table style="width:100%; border-collapse: collapse; font-size: 14px;">
                <thead style="background: #f1f5f9;">
                    <tr>
                        <th style="padding:10px; text-align:right;">اليوم</th>
                        <th style="padding:10px; text-align:center;">من</th>
                        <th style="padding:10px; text-align:center;">إلى</th>
                        <th style="padding:10px; text-align:center;">مغلق</th>
                    </tr>
                </thead>
                <tbody id="scheduleTableBody">
                    <!-- Schedule rows inserted here -->
                </tbody>
            </table>
        </div>

        <div class="section-box">
            <div class="section-title">📜 الشروط والأحكام</div>
            <p style="font-size:12px; color:#666; margin-bottom:10px;">أضف الشروط التي ستظهر في أسفل ورقة الكشف وأمر
                العمل.</p>

            <div class="form-group">
                <input type="text" id="newTerm" placeholder="اكتب الشرط واضغط Enter..." onkeypress="addTerm(event)">
                <button class="btn btn-primary" onclick="addTermManual()" style="margin-top:5px;">إضافة شرط</button>
            </div>

            <ul id="termsList" style="list-style:none; padding:0;">
                <!-- Terms injected here -->
            </ul>
        </div>

        <button class="btn btn-success btn-full" onclick="saveAllSettings()">💾 حفظ كافة الإعدادات</button>
    </div>

    <script>
        // Work Schedule Handling
        const daysMap = {
            'Sunday': 'الأحد', 'Monday': 'الاثنين', 'Tuesday': 'الثلاثاء', 
            'Wednesday': 'الأربعاء', 'Thursday': 'الخميس', 'Friday': 'الجمعة', 'Saturday': 'السبت'
        };
        let currentSchedule = [];

        function renderSchedule(schedule) {
            currentSchedule = schedule;
            const tbody = document.getElementById('scheduleTableBody');
            tbody.innerHTML = schedule.map(day => `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding:10px; font-weight:600;">${daysMap[day.day_of_week]}</td>
                    <td style="padding:10px; text-align:center;">
                        <input type="time" value="${day.start_time || ''}" ${day.is_closed ? 'disabled' : ''} 
                            onchange="updateScheduleDay('${day.day_of_week}', 'start_time', this.value)">
                    </td>
                    <td style="padding:10px; text-align:center;">
                        <input type="time" value="${day.end_time || ''}" ${day.is_closed ? 'disabled' : ''} 
                            onchange="updateScheduleDay('${day.day_of_week}', 'end_time', this.value)">
                    </td>
                    <td style="padding:10px; text-align:center;">
                        <input type="checkbox" ${day.is_closed ? 'checked' : ''} 
                            onchange="updateScheduleDay('${day.day_of_week}', 'is_closed', this.checked); loadSettings();">
                    </td>
                </tr>
            `).join('');
        }

        function updateScheduleDay(dayName, field, value) {
            const day = currentSchedule.find(d => d.day_of_week === dayName);
            if (day) day[field] = value;
        }

        // Load Settings
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if (settings.workshop_name) document.getElementById('workshopName').value = settings.workshop_name;
                if (settings.workshop_desc) document.getElementById('workshopDesc').value = settings.workshop_desc;
                if (settings.workshop_phone) document.getElementById('workshopPhone').value = settings.workshop_phone;
                if (settings.vat_number) document.getElementById('vatNumber').value = settings.vat_number;

                const res2 = await fetch('/api/terms');
                const terms = await res2.json();
                renderTerms(terms.map(t => t.term));

                const res3 = await fetch('/api/work-schedule');
                const schedule = await res3.json();
                renderSchedule(schedule);
            } catch (e) { console.error(e); }
        }

        // Terms Management
        let currentTerms = [];

        function renderTerms(terms) {
            currentTerms = terms || [];
            const list = document.getElementById('termsList');
            list.innerHTML = '';

            currentTerms.forEach((term, index) => {
                const li = document.createElement('li');
                li.style.cssText = 'background: white; padding: 10px; border-bottom: 1px solid #eee; display:flex; justify-content:space-between; align-items:center;';
                li.innerHTML = `
                    <span>• ${term}</span>
                    <button onclick="removeTerm(${index})" style="background:none; border:none; color:red; cursor:pointer;">❌</button>
                `;
                list.appendChild(li);
            });
        }

        function addTerm(e) {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val) {
                    currentTerms.push(val);
                    renderTerms(currentTerms);
                    e.target.value = '';
                }
            }
        }

        function addTermManual() {
            const input = document.getElementById('newTerm');
            const val = input.value.trim();
            if (val) {
                currentTerms.push(val);
                renderTerms(currentTerms);
                input.value = '';
            }
        }

        function removeTerm(index) {
            currentTerms.splice(index, 1);
            renderTerms(currentTerms);
        }

        async function saveAllSettings() {
            try {
                const settingsPayload = {
                    workshop_name: document.getElementById('workshopName').value,
                    workshop_desc: document.getElementById('workshopDesc').value,
                    workshop_phone: document.getElementById('workshopPhone').value,
                    vat_number: document.getElementById('vatNumber').value
                };
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settingsPayload)
                });

                await fetch('/api/terms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ terms: currentTerms })
                });

                await fetch('/api/work-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ schedule: currentSchedule })
                });

                alert('✅ تم حفظ كافة الإعدادات بنجاح');
            } catch (e) { console.error(e); alert('❌ خطأ في الحفظ'); }
        }

        loadSettings();
    </script>
</body>

</html>
